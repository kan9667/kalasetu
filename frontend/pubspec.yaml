name: kalasetu
description: "AI-driven market linkage and smart cataloging app for marginalized artisans"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.6.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Media
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  record: ^5.1.2
  just_audio: ^0.9.40
  flutter_tts: ^4.1.0
  cached_network_image: ^3.4.1

  # Localization
  easy_localization: ^3.0.7

  # UI & Icons
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  lottie: ^3.1.3

  # Utils
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/translations/
